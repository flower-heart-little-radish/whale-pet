<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      #wrap {
        display: flex;
        align-items: flex-start;
      }
      .panel {
        margin: 22px 0 22px 22px;
        padding: 6px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(28, 33, 48, 0.99), rgba(20, 24, 36, 0.99));
        border: 1px solid rgba(150, 178, 240, 0.18);
        box-shadow: 0 6px 14px rgba(2, 6, 16, 0.45);
        font-size: 12px;
        color: #dbe3f5;
        width: 158px;
        min-width: 0;
        max-width: 158px;
        flex: 0 0 158px;
        box-sizing: border-box;
        overflow-x: hidden;
        max-height: calc(100vh - 44px);
        overflow-y: auto;
      }
      #sub {
        display: none;
        margin-left: 6px;
      }
      .m-item {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sub.open {
        display: block;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 29px;
        padding: 0 9px;
        border-radius: 9px;
        cursor: pointer;
        white-space: nowrap;
      }
      .m-item:hover {
        background: rgba(96, 130, 210, 0.22);
      }
      .m-item.on {
        background: rgba(96, 130, 210, 0.2);
      }
      .m-item.danger {
        color: #ffb4b4;
      }
      .m-item.danger:hover {
        background: rgba(210, 80, 80, 0.22);
      }
      .m-go {
        margin-left: auto;
        opacity: 0.55;
        font-size: 14px;
        transform: translateY(-1px);
      }
      .m-box {
        width: 13px;
        color: #8fc0ff;
        font-size: 12px;
        text-align: center;
      }
      .m-radio {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid rgba(160, 185, 235, 0.55);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .m-radio i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6fa8ff;
        display: block;
      }
      .m-sep {
        height: 1px;
        margin: 5px 8px;
        background: rgba(150, 178, 240, 0.14);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="menu" class="panel"></div>
      <div id="sub" class="panel"></div>
    </div>
    <script src="menu-win.js"></script>
  </body>
</html>
